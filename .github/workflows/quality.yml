name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: grocer_test
          POSTGRES_PASSWORD: local_only
          POSTGRES_DB: grocer_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U grocer_test -d grocer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://grocer_test:local_only@127.0.0.1:55432/postgres
      TEST_DATABASE_URL: postgresql://grocer_test:local_only@127.0.0.1:55432/grocer_test
      WHATSAPP_PHONE_NUMBER_ID: "000000000000000"
      WHATSAPP_BUSINESS_ACCOUNT_ID: "000000000000000"
      WHATSAPP_ACCESS_TOKEN: ci-not-a-real-token
      WHATSAPP_APP_SECRET: ci-only-app-secret
      WHATSAPP_VERIFY_TOKEN: ci-only-verify-token
      DATA_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      LIVE_CHECKOUT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt ruff
      - run: ruff check backend tests
      - run: pytest -q -m "not live"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
