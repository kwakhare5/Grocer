[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers
markers =
    db: needs PostgreSQL; requires TEST_DATABASE_URL
    live: calls a live external service; excluded by default
    scripted: injects a fake external client on purpose; never proof of live behavior
