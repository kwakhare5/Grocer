services:
  - type: web
    name: grocer-backend
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_PUBLIC_NUMBER
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: qwen/qwen3.8-27b:free
      - key: AGENT_ROUTE_ENABLED
        value: true
      - key: COMMERCE_ADAPTER_TYPE
        value: swiggy_mcp
      - key: CHECKOUT_MODE
        value: review
      - key: LIVE_CHECKOUT_ENABLED
        value: false
      - key: SWIGGY_REDIRECT_URI
        value: https://grocerr.vercel.app/
      - key: SWIGGY_CLIENT_ID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: CONNECT_BASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://grocerr.vercel.app

