services:
  - type: web
    name: grocer-backend
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: COMMERCE_ADAPTER_TYPE
        value: swiggy_mcp
      - key: CHECKOUT_MODE
        value: review
      - key: SWIGGY_REDIRECT_URI
        value: https://grocerr.vercel.app/
      - key: SWIGGY_CLIENT_ID
        sync: false
